name: IaC controls (no AWS)
on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [feature/fase1-iac]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-24.04
    env:
      TFLINT_PLUGIN_DIR: ${{ github.workspace }}/.tools/tflint-plugins
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4 (resolved annotated tag)
        with:
          tflint_version: v0.61.0
      - name: Install security scanner
        run: python -m pip install -r requirements-ci.txt
      - name: Init (without backend)
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Format
        run: terraform fmt -check -recursive
      - name: Official portal template integrity and syntax
        run: |
          printf '%s  %s\n' '0f06f8f42390f0f38ea7e0587d6bb314caea734aa44a18645b62eaf06ce639fb' 'templates/user_data_v1.sh.tpl' | sha256sum --check --strict
          bash -n templates/user_data_v1.sh.tpl
      - name: Validate
        if: ${{ !cancelled() }}
        run: terraform validate -no-color
      - name: IaC assertions with mocks
        if: ${{ !cancelled() }}
        run: terraform test -no-color
      - name: Lint
        if: ${{ !cancelled() }}
        run: |
          tflint --init
          tflint --recursive --max-workers=1 --config="$GITHUB_WORKSPACE/.tflint.hcl"
      - name: IaC security
        if: ${{ !cancelled() }}
        run: checkov --config-file .checkov.yml
      - name: Workflow and repository policy
        if: ${{ !cancelled() }}
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/check_repository.py
  repository-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install standalone repository checker dependencies
        run: python -m pip install -r requirements-repository.txt
      - name: Regression tests and policy (python-hcl2 8)
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/check_repository.py
